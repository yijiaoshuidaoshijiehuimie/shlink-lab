services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - shlink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 5s
      timeout: 3s
      retries: 20

  shlink:
    image: shlinkio/shlink:5.1.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEFAULT_DOMAIN: localhost:8080
      IS_HTTPS_ENABLED: "false"
      DB_DRIVER: postgres
      DB_HOST: db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      SKIP_INITIAL_GEOLITE_DOWNLOAD: "true"
      AUTO_RESOLVE_TITLES: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/rest/health')===false?1:0);"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  shlink-db:
